services:
  api:
    build: ./apps/api
    environment:
      NODE_PORT: ${NODE_PORT:-8080}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      PYTHON_SERVICE_URL: http://intelligence:8081
    ports:
      - "${NODE_PORT:-8080}:8080"
    depends_on:
      intelligence:
        condition: service_healthy
    restart: unless-stopped
  intelligence:
    build: ./intelligence
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-8}
      CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-12}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentone
      POSTGRES_USER: agentone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentone -d agentone"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
