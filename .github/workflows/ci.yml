name: AgentOne CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r intelligence/requirements.txt
      - run: PYTHONPATH=intelligence pytest intelligence/tests -q
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd apps/api && npm install --no-audit --no-fund && npm run build && npm test
